[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Size, because program rent is charged per byte and the loader reserves twice
# the binary by default. Every kilobyte cut here is SOL that stays liquid.
opt-level = "z"
panic = "abort"
strip = true
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
