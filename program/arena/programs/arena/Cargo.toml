[package]
name = "arena"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arena"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
# default-features brings token-2022, metadata and more CPI surface we never
# touch, and all of it lands in the binary — which is what program rent is
# charged on. We use SPL Token and ATAs, nothing else.
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "associated_token", "token_2022"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
