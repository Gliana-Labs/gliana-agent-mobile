<!doctype html><html><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:600px;overflow:hidden}
  body{background:#08080b;font-family:'IBM Plex Sans',sans-serif;color:#f4f4f5;position:relative}
  .glow{position:absolute;inset:0;
    background:
      radial-gradient(720px 520px at 14% 44%, rgba(245,158,11,.20), transparent 62%),
      radial-gradient(520px 420px at 94% 86%, rgba(220,38,38,.12), transparent 66%);}
  .grid{position:absolute;inset:0;opacity:.32;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:48px 48px;}
  .wrap{position:relative;height:100%;display:flex;align-items:center;gap:20px;padding:0 52px}
  .copy{width:566px;flex:none}
  .lockup{display:flex;align-items:center;gap:20px}
  .lockup img{width:92px;height:92px;border-radius:21px;flex:none;
    border:1px solid #2a2a31;box-shadow:0 12px 34px rgba(0,0,0,.6)}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:54px;
     line-height:.98;letter-spacing:-.035em}
  h1 .p{display:block;background:linear-gradient(92deg,#fbbf24,#f97316 58%,#ef4444);
        -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:22px;font-size:20px;line-height:1.5;color:#b9b9c2;max-width:34ch}
  .sub b{color:#e9e9ee;font-weight:500}
  .tags{margin-top:24px;display:flex;gap:10px}
  .tag{font-family:'JetBrains Mono',monospace;font-size:13.5px;
       padding:9px 13px;border-radius:9px;border:1px solid #2c2c33;color:#a1a1aa}
  .tag.hot{border-color:#7c4d12;color:#fbbf24}
  /* the priced proposal is the product: a model, an exact price, one approval */
  .cards{position:relative;flex:1;height:600px}
  .cards img{position:absolute;border-radius:14px;border:1px solid #2a2a31;
    box-shadow:0 30px 64px rgba(0,0,0,.66)}
  .c1{width:252px;left:2px;top:190px;transform:rotate(-3.2deg)}
  .c2{width:262px;left:238px;top:118px;transform:rotate(2.8deg)}
  /* the SNAP transformation, deliberately small: it is one feature, not the offer */
  .tf{position:absolute;left:14px;top:406px;display:flex;align-items:center;gap:11px}
  .tf img{position:static;width:78px;height:96px;object-fit:cover;border-radius:10px;
    border:1px solid #2a2a31;box-shadow:0 10px 24px rgba(0,0,0,.55)}
  .tf .ar{font-family:'JetBrains Mono',monospace;font-size:17px;color:#fbbf24}
  .tf .cap{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5;color:#8b8b95}
  .tf .cap b{display:block;color:#d4d4d9;font-weight:400}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div class="copy">
    <div class="lockup">
      <img src="icon.png" alt="" />
      <h1>Gliana Agent<span class="p">Pay per result.</span></h1>
    </div>
    <p class="sub"><b>116 AI models</b> — image, video, voice, music, chat — and <b>50 utility tools</b>. The agent picks one, quotes the exact price, and you approve it once from your own wallet.</p>
    <div class="tags">
      <span class="tag hot">no account</span>
      <span class="tag">no subscription</span>
      <span class="tag">USDC on Solana</span>
    </div>
  </div>
  <div class="cards">
    <img class="c1" src="card_music.png" alt="" />
    <img class="c2" src="card_tool.png" alt="" />
    <div class="tf">
      <img src="before.jpg" alt="" /><span class="ar">&rarr;</span><img src="after.png" alt="" />
      <span class="cap"><b>photograph anything</b>flux-1-kontext-pro &middot; 4.8&cent;</span>
    </div>
  </div>
</div>
</body></html>
