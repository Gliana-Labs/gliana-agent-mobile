# Solana dApp Store publishing config. Fill in the TODOs, then mint with the
# dApp Store CLI (see ../PUBLISHING.md). Keypair JSONs in this dir are gitignored.
publisher:
  name: Gliana Labs
  website: https://glianalabs.com
  email: contact@glianalabs.com
  media:
    - purpose: icon
      uri: ../assets/icon.png

app:
  name: Gliana Agent
  android_package: com.glianalabs.agent
  urls:
    license_url: https://glianalabs.com/terms
    copyright_url: https://glianalabs.com
    privacy_policy_url: https://glianalabs.com/privacy
    website: https://agent.glianalabs.com
  media:
    - purpose: icon
      uri: ../assets/icon.png

release:
  address: # filled by the CLI on `create release`
  media:
    - purpose: banner
      uri: ./media/banner-1200x600.png
    # TODO: capture ≥4 phone screenshots on the device (identical dimensions):
    # wallet connect, a proposal card with the price, a generated result, chat.
    - purpose: screenshot
      uri: ./media/screenshot-1.png
    - purpose: screenshot
      uri: ./media/screenshot-2.png
    - purpose: screenshot
      uri: ./media/screenshot-3.png
    - purpose: screenshot
      uri: ./media/screenshot-4.png
  files: []
  catalog:
    en-US:
      name: Gliana Agent
      short_description: 90+ AI models and utility tools — pay per result from your wallet.
      long_description: >
        Describe what you want. Gliana Agent picks the right model, quotes the exact
        price before anything runs, and you approve it with one tap — paid in USDC
        from your Solana wallet via Mobile Wallet Adapter.


        90+ AI models across image, video, voice, music, animate and transcribe, plus
        utility tools: turn a web page into structured data, summarise a YouTube
        video, read a document, build social cards, check token and currency prices.


        No signup, no API key, no subscription, and no balance to top up — you pay
        per result, and nothing is charged if a request is rejected.
      new_in_version: >
        Wallet payments fixed — transactions signed with Phantom, Solflare or Seed
        Vault now settle reliably. The agent can now run utility tools too, not just
        generate: pull structured data out of a web page, summarise a video, read a
        document, make social cards.
      saga_features: Pay-per-result with Mobile Wallet Adapter (Seed Vault).
      android_details:
        - Native Android app built for Seeker — payments via Mobile Wallet
          Adapter (Seed Vault); no Google Play services required.
