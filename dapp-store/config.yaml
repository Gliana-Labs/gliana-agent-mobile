# Solana dApp Store publishing config. Fill in the TODOs, then mint with the
# dApp Store CLI (see ../PUBLISHING.md). Keypair JSONs in this dir are gitignored.
publisher:
  name: Gliana Labs
  website: https://glianalabs.com
  email: contact@glianalabs.com
  media:
    - purpose: icon
      uri: ./media/icon-512.png

app:
  name: Gliana Agent
  android_package: com.glianalabs.agent
  urls:
    license_url: https://glianalabs.com/terms
    copyright_url: https://glianalabs.com
    privacy_policy_url: https://glianalabs.com/privacy
    website: https://agent.glianalabs.com
  media:
    - purpose: icon
      uri: ./media/icon-512.png

release:
  address: # filled by the CLI on `create release`
  media:
    - purpose: banner
      uri: ./media/banner-1200x600.png
    # Six portrait 1080x1920 (9:16) captures, in story order: the map, the
    # studio, a priced model proposal, a priced utility tool, today's Arena
    # round, the gallery. Padded to 9:16 rather than cropped — the app's
    # background is the same near-black, so the padding does not read as bars.
    - purpose: screenshot
      uri: ./media/screenshot-1.png
    - purpose: screenshot
      uri: ./media/screenshot-2.png
    - purpose: screenshot
      uri: ./media/screenshot-3.png
    - purpose: screenshot
      uri: ./media/screenshot-4.png
    - purpose: screenshot
      uri: ./media/screenshot-5.png
    - purpose: screenshot
      uri: ./media/screenshot-6.png
  files: []
  catalog:
    en-US:
      name: Gliana Agent
      # The portal's Subtitle field caps at 50 characters.
      short_description: 110+ AI models, paid per result from your wallet
      long_description: >
        Describe what you want. Gliana Agent picks the model, shows you the exact
        price before anything runs, and takes one approval from your Solana wallet
        — 110+ models across image, video, voice, music and chat, plus 50 utility
        tools like SEC filing search, document reading and web extraction.


        No signup, no API key, no subscription, and no balance to top up. You pay
        per result, and a request that fails costs you nothing.


        Point the camera at something to restyle it, or stake what you made in the
        daily Arena and vote on everyone else's.
      new_in_version: >
        The Arena now has an all-time board. Every wallet that has ever placed is
        ranked by wins, and by what those wins were worth in SKR. It is counted
        from the chain rather than from this device, so a reinstall never costs
        you your record, and your own row is pinned below the list when you are
        outside the top ten.


        Payouts are fairer too. Each place is now paid from the pot as it stood
        when the round closed, so the order people claim in no longer changes
        what anyone receives.
      saga_features: Pay-per-result with Mobile Wallet Adapter (Seed Vault).
      android_details:
        - Native Android app built for Seeker — payments via Mobile Wallet
          Adapter (Seed Vault); no Google Play services required.
