# What a reviewer can check without taking our word for it.
#
# The app itself cannot be tested here — Mobile Wallet Adapter needs a device, a
# wallet app and Seed Vault, so the wallet flow is evidenced by the demo video
# and the screenshots in the README instead. Everything that does NOT need
# hardware runs on every push.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  program:
    name: Anchor program (17 LiteSVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No Solana toolchain here on purpose. The tests load program/arena/arena.so,
      # which is committed: cargo-build-sbf emits an SBF version that follows the
      # toolchain and litesvm 0.3.3 executes only a narrow range of them. A newer
      # toolchain built a program it refused to load; 2.1.21 shipped a rustc the
      # dependency tree rejected; 2.2.20 loaded and then aborted the process
      # mid-run. The binary under test is therefore the binary that is deployed,
      # and `compiles` below proves the source still builds.
      - name: Test the program
        working-directory: program/arena
        run: |
          npm ci
          npm test

  compiles:
    name: The program still compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and the SBF toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
            program/arena/target
          key: sbf-stable-${{ runner.os }}-${{ hashFiles('program/arena/Cargo.lock') }}

      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: program/arena
        run: |
          cargo-build-sbf --version
          cargo build-sbf
          ls -la target/deploy/arena.so

      # A source change that is never recompiled into the committed binary would
      # leave the tests passing against the old one. This cannot compare bytes —
      # a different toolchain produces a different object — but it can say when
      # the source has moved on without the artefact.
      - name: Warn if the committed binary looks stale
        working-directory: program/arena
        run: |
          src=$(git log -1 --format=%ct -- programs/arena/src)
          bin=$(git log -1 --format=%ct -- arena.so)
          echo "last source change: $(date -d @$src)"
          echo "last binary change: $(date -d @$bin)"
          if [ "$src" -gt "$bin" ]; then
            echo "::warning::programs/arena/src changed after arena.so was last committed — rebuild with 'cargo build-sbf && cp target/deploy/arena.so arena.so' so the tests run against current code."
          fi

  typecheck:
    name: App typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit

  gateway:
    name: The paid path is live (informational)
    runs-on: ubuntu-latest
    # Informational on purpose: this probes a running service, so a red mark
    # here would mean the gateway is down rather than that this commit is
    # broken. It is here because "no account, pay per call" is the central
    # claim, and a claim worth making is worth probing.
    continue-on-error: true
    steps:
      - name: The catalog the app reads
        run: |
          # /v1/models returns {"models": [...]}, not a bare array — len() on
          # the response itself counts the keys and reports 1.
          n=$(curl -sf --max-time 30 https://api.glianalabs.com/v1/models | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["models"]))')
          echo "models served: $n"
          test "$n" -gt 100

      - name: An unpaid call is refused with 402, not 200
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
            -X POST https://api.glianalabs.com/v1/infer \
            -H 'content-type: application/json' \
            -d '{"model":"krea-2-medium-turbo","prompt":"a paper crane"}')
          echo "status: $code"
          head -c 300 /tmp/body; echo
          test "$code" = "402"
